apiVersion: apps/v1
kind: Deployment

metadata:
  name: customer-api
  namespace: app-communication

spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-api
  template:
    metadata:
      labels:
        app: customer-api
    spec:
      containers:
        - name: customer-api
          image: maranecr.azurecr.io/customer-api:latest
          ports:
            - containerPort: 8080

          # -----------------------------------
          # Readiness Probe
          # -----------------------------------
          # kubernetes will only send traffic to the pod if the readiness probe is successful and return a 200 OK response. 
          # If the readiness probe fails, the pod will be removed from the service endpoints and will not receive traffic until it passes the readiness probe again.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080


            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          # -----------------------------------

          # -----------------------------------
          # Liveness Probe
          # -----------------------------------
          # If the application is not responding, the liveness probe will fail and the pod will be restarted.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080

            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          # -----------------------------------
          # Resource Requests and Limits
          # -----------------------------------
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
        - name: otel-collector
          image: otel/opentelemetry-collector:latest
          args:
            - "--config=/conf/otel-collector-config.yaml"
          ports:
            - containerPort: 4317
              name: otlp-grpc

            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: otel-config
              mountPath: /conf

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: otel-config
          configMap:
            name: otel-collector-config
            
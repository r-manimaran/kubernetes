# TEMPLATE ONLY. Do NOT commit real credentials to Git.
# Fill in, apply, then delete or keep out of source control.
# auth = base64 of "<username>:<password>"  ->  echo -n 'user:pass' | base64 -w0
apiVersion: v1
kind: Secret
metadata:
  name: acr-cred
  namespace: jenkins-agents
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "<acrName>.azurecr.io": {
          "username": "<appId-or-token-name>",
          "password": "<password>",
          "auth": "<base64-of-username:password>"
        }
      }
    }
